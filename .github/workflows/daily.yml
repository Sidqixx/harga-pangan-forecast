name: daily

on:
  schedule:
    - cron: "0 3 * * *" # 10:00 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Fetch last 14 days (new prices + revisions)
        run: python fetch.py
      - name: Quality check
        if: always() # still report and save whatever chunks succeeded
        run: python quality.py
      - name: Gate, forecast next 14 days, spike alerts
        if: always()
        run: python live.py
      - name: Commit prices, forecasts, alerts, model status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: update up to $(date -u +%F)"
          git push

  dashboard:
    needs: update
    if: always() # rebuild from whatever data the repo has, even after a failed fetch
    runs-on: ubuntu-latest
    permissions: # job-level permissions replace the workflow-level ones
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # include the data commit made by the update job
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python report.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
