name: daily

on:
  schedule:
    - cron: "0 3 * * *" # 10:00 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Fetch last 14 days (new prices + revisions)
        run: python fetch.py
      - name: Quality check
        if: always() # still report and save whatever chunks succeeded
        run: python quality.py
      - name: Commit new prices
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git diff --cached --quiet || git commit -m "data: prices up to $(date -u +%F)"
          git push
